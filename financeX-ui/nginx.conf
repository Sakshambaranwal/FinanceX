server {
    listen 80;
    listen [::]:80;
    server_name 13.203.155.65;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/financex;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 13.203.155.65;

    ssl_certificate /etc/letsencrypt/live/13.203.155.65/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.203.155.65/privkey.pem;

    root /var/www/financex;
    index index.html index.htm;

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy backend API endpoints to Gateway on port 8080
    location ~ ^/(login|register|auth|ping|user|admin|public|expense|investment|p2p|creditcard)(/.*)?$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

