version: '3.8'

services:
  # Database Service
  postgres:
    image: postgres:17-alpine
    container_name: financeapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: saksham
      POSTGRES_USER: saksham
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # All-in-One Unified Application Container
  financeapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financeapp-all-in-one
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/saksham
      SPRING_DATASOURCE_USERNAME: saksham
      SPRING_DATASOURCE_PASSWORD: password123
    ports:
      - "80:80"

volumes:
  postgres_data:

